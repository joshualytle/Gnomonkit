<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap">
<style>
html,body{margin:0;background:#0f1518;}
.stage{width:720px;height:200px;box-sizing:border-box;display:flex;align-items:center;gap:28px;padding:0 24px;
  background:#0f1518;font-family:Sora,"Segoe UI",system-ui,sans-serif;color:#f4f7f6;}
.badge{width:150px;height:150px;flex:none}
.text{display:grid;gap:0px}
.word{font-weight:800;font-size:84px;letter-spacing:-0.035em;line-height:0.9}
.word span{color:#1ec8b4}
.tag{font-weight:400;font-size:24px;color:#a9b8b6;line-height:1.35}
.tag .line{display:block;white-space:nowrap}
.pillars{display:flex;align-items:center;gap:22px;color:#1ec8b4}
.pillar{display:flex;align-items:center;gap:10px}
.pillar svg{width:34px;height:34px}
.pillar span{color:#f4f7f6;font-weight:700;font-size:17px;letter-spacing:0.14em;text-transform:uppercase}
.sep{width:1px;height:30px;background:#2c3a3d}
</style></head><body><div class="stage">
<img class="badge" src="../badge-dark.svg" alt="">
<div class="text"><div class="word">gnomon<span>kit</span></div></div>
</div></body></html>
