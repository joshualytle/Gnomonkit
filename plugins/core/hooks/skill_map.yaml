# The ACTION taxonomy -- THE single source, read by the runtime hook AND by
# route_bench.py, so a group cannot drift between what is measured and what
# ships.
#
# GROUPED BY SITUATION, NOT SUBJECT. Grouping by TOPIC tends to do no better
# than flat selection, because what makes skills share a topic is exactly
# what makes them confusable: handed the right topic group, a model still has
# to choose between near-identical candidates. Grouping by the moment someone
# is in separates them once the ask is distilled. Check any regrouping with
# route_bench.py on your own labelled set.
#
# A skill may appear in more than one situation. That is deliberate: a
# situation is a moment, and the same skill can matter at several.
#
# DOMAIN-PACK SKILLS ARE NOT LISTED HERE. This map is injected into EVERY
# session, and a pack (seo, ...) is enabled only in the repos it serves. A pack
# skill listed here would be offered in sessions where it is not installed.
# Pack skills are routed by the routing row in the serving repo's CLAUDE.md
# instead (e.g. "Use: seo:page-pass"). answer-engine-visibility left this map
# when it moved to the seo pack.

situations:

  about-to-ship:
    - ship-through-prs
    - merged-is-not-shipped
    - stacked-pr-conflicts
    - release-pipeline-traps
    - merge-guidance

